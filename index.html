<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOD-OMETER</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Help overlay (hidden by default) -->
    <div id="help-overlay" class="help-overlay hidden">
        <div class="help-content">
            <h2>OPERATOR CONTROLS</h2>
            <div class="help-grid">
                <div class="help-item">
                    <span class="help-key">1-6</span>
                    <span class="help-desc">Jump to level</span>
                </div>
                <div class="help-item">
                    <span class="help-key">↑</span>
                    <span class="help-desc">Step up</span>
                </div>
                <div class="help-item">
                    <span class="help-key">↓</span>
                    <span class="help-desc">Step down</span>
                </div>
                <div class="help-item">
                    <span class="help-key">R</span>
                    <span class="help-desc">Reset to Level 1</span>
                </div>
                <div class="help-item">
                    <span class="help-key">SPACE</span>
                    <span class="help-desc">Applause wobble</span>
                </div>
                <div class="help-item">
                    <span class="help-key">H</span>
                    <span class="help-desc">Toggle help</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main gauge container -->
    <div class="gauge-container">
        <svg id="gauge" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
            <!-- Definitions for gradients and effects -->
            <defs>
                <!-- Brass gradient for gauge face -->
                <radialGradient id="brassGradient" cx="50%" cy="50%">
                    <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#c5a028;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#8b7355;stop-opacity:1" />
                </radialGradient>

                <!-- Dark iron gradient for outer ring -->
                <radialGradient id="ironGradient" cx="50%" cy="50%">
                    <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
                </radialGradient>

                <!-- Needle gradient -->
                <linearGradient id="needleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#8b0000;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4a0000;stop-opacity:1" />
                </linearGradient>

                <!-- Embossed text filter -->
                <filter id="emboss">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
                    <feOffset in="blur" dx="2" dy="2" result="offsetBlur"/>
                    <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.5"
                                       specularExponent="10" lighting-color="#ffffff" result="specOut">
                        <fePointLight x="-5000" y="-10000" z="20000"/>
                    </feSpecularLighting>
                    <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
                    <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic"
                                k1="0" k2="1" k3="1" k4="0"/>
                </filter>

                <!-- Shadow for depth -->
                <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
                    <feOffset dx="3" dy="3" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.5"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- Outer iron ring -->
            <circle cx="400" cy="350" r="280" fill="url(#ironGradient)" filter="url(#dropShadow)"/>

            <!-- Rivets around outer ring -->
            <circle cx="400" cy="70" r="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
            <circle cx="600" cy="150" r="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
            <circle cx="680" cy="350" r="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
            <circle cx="600" cy="550" r="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
            <circle cx="400" cy="630" r="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
            <circle cx="200" cy="550" r="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
            <circle cx="120" cy="350" r="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
            <circle cx="200" cy="150" r="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>

            <!-- Main brass face -->
            <circle cx="400" cy="350" r="250" fill="url(#brassGradient)"/>

            <!-- Subtle patina texture (semi-transparent circles) -->
            <circle cx="350" cy="300" r="40" fill="#8b7355" opacity="0.1"/>
            <circle cx="480" cy="280" r="30" fill="#8b7355" opacity="0.08"/>
            <circle cx="320" cy="420" r="35" fill="#8b7355" opacity="0.09"/>
            <circle cx="500" cy="400" r="25" fill="#8b7355" opacity="0.07"/>

            <!-- Tick marks (no numbers) -->
            <g id="tick-marks">
                <!-- Major ticks at key positions -->
                <line x1="400" y1="115" x2="400" y2="135" stroke="#4a3728" stroke-width="3" opacity="0.6"/>
                <line x1="592" y1="172" x2="580" y2="185" stroke="#4a3728" stroke-width="3" opacity="0.6"/>
                <line x1="635" y1="350" x2="615" y2="350" stroke="#4a3728" stroke-width="3" opacity="0.6"/>
                <line x1="592" y1="528" x2="580" y2="515" stroke="#4a3728" stroke-width="3" opacity="0.6"/>
                <line x1="400" y1="585" x2="400" y2="565" stroke="#4a3728" stroke-width="3" opacity="0.6"/>
                <line x1="208" y1="528" x2="220" y2="515" stroke="#4a3728" stroke-width="3" opacity="0.6"/>
                <line x1="165" y1="350" x2="185" y2="350" stroke="#4a3728" stroke-width="3" opacity="0.6"/>
                <line x1="208" y1="172" x2="220" y2="185" stroke="#4a3728" stroke-width="3" opacity="0.6"/>

                <!-- Minor ticks -->
                <line x1="337" y1="125" x2="345" y2="140" stroke="#4a3728" stroke-width="2" opacity="0.4"/>
                <line x1="463" y1="125" x2="455" y2="140" stroke="#4a3728" stroke-width="2" opacity="0.4"/>
                <line x1="270" y1="165" x2="283" y2="175" stroke="#4a3728" stroke-width="2" opacity="0.4"/>
                <line x1="530" y1="165" x2="517" y2="175" stroke="#4a3728" stroke-width="2" opacity="0.4"/>
                <line x1="530" y1="535" x2="517" y2="525" stroke="#4a3728" stroke-width="2" opacity="0.4"/>
                <line x1="270" y1="535" x2="283" y2="525" stroke="#4a3728" stroke-width="2" opacity="0.4"/>
                <line x1="337" y1="575" x2="345" y2="560" stroke="#4a3728" stroke-width="2" opacity="0.4"/>
                <line x1="463" y1="575" x2="455" y2="560" stroke="#4a3728" stroke-width="2" opacity="0.4"/>
            </g>

            <!-- Engraved/embossed title text -->
            <text x="400" y="470" font-family="serif" font-size="48" font-weight="bold"
                  text-anchor="middle" fill="#8b7355" filter="url(#emboss)"
                  letter-spacing="4">GOOD-OMETER</text>

            <!-- Center hub/pivot -->
            <circle cx="400" cy="350" r="20" fill="url(#ironGradient)" filter="url(#dropShadow)"/>
            <circle cx="400" cy="350" r="12" fill="#2a2a2a"/>

            <!-- Needle (will be rotated by JavaScript) -->
            <g id="needle" transform-origin="400 350">
                <!-- Needle shadow for depth -->
                <path d="M 395 350 L 400 140 L 405 350 Z" fill="#000000" opacity="0.3" transform="translate(3, 3)"/>
                <!-- Main needle body -->
                <path d="M 395 350 L 400 140 L 405 350 Z" fill="url(#needleGradient)" stroke="#2a0000" stroke-width="1"/>
                <!-- Needle center cap -->
                <circle cx="400" cy="350" r="8" fill="#8b0000" stroke="#4a0000" stroke-width="2"/>
            </g>

            <!-- Glass reflection effect (subtle) -->
            <ellipse cx="300" cy="250" rx="100" ry="80" fill="#ffffff" opacity="0.05"/>
            <ellipse cx="320" cy="240" rx="60" ry="50" fill="#ffffff" opacity="0.08"/>
        </svg>
    </div>

    <script src="app.js"></script>
</body>
</html>
